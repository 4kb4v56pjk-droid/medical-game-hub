<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolic Pathways Study Game</title>
    <style>
        :root {
            --cream: #FAFAF8;
            --beige: #F5EFE7;
            --grey-light: #E8E4DC;
            --grey-mid: #A89F96;
            --grey-dark: #3D3A36;
            --accent: #7C6B5D;
            --accent-light: #9D8E7D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--cream);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: var(--grey-dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #E8DFD5 0%, #D4C5B9 100%);
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--grey-light);
        }

        .header-content h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--grey-dark);
            font-weight: 600;
        }

        .header-content p {
            font-size: 0.95rem;
            color: var(--grey-mid);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--accent-light);
            transform: translateX(-2px);
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .mode-btn {
            padding: 2rem;
            border: 2px solid var(--grey-light);
            border-radius: 12px;
            background: var(--cream);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: var(--grey-dark);
        }

        .mode-btn:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(124, 107, 93, 0.15);
            color: var(--accent);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #E8DFD5 0%, #D4C5B9 100%);
            color: var(--grey-dark);
            border-color: var(--accent);
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }

        .game-area {
            display: none;
            padding: 2rem;
        }

        .game-area.active {
            display: block;
        }

        /* STUDY MODE */
        .study-container {
            min-height: 400px;
        }

        .pathway-display {
            background: var(--beige);
            border: 2px solid var(--grey-light);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            overflow-x: auto;
        }

        .blank-space {
            background: #FFE5E5;
            border: 3px dashed #C8756E;
            border-radius: 8px;
            padding: 1rem;
            min-width: 100px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8B5A4C;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: grab;
            transition: all 0.3s ease;
            position: relative;
            text-align: center;
        }

        .blank-space:hover {
            background: #FFD4D4;
            transform: scale(1.05);
        }

        .blank-space.filled {
            background: #E5F5E5;
            border-color: #7C8B5C;
            color: #5C6B3C;
            cursor: default;
        }

        .blank-space.filled-wrong {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .card-container {
            background: var(--beige);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .card-container h3 {
            margin-bottom: 1rem;
            color: var(--grey-dark);
            font-size: 0.95rem;
        }

        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card {
            background: linear-gradient(135deg, #E8DFD5 0%, #D4C5B9 100%);
            color: var(--grey-dark);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
            transition: all 0.3s ease;
            font-weight: 600;
            border: 2px solid transparent;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(124, 107, 93, 0.2);
        }

        .card.used {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* GAME MODE */
        .game-container {
            min-height: 400px;
        }

        .reaction-display {
            background: var(--beige);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .reaction-box {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 0.8rem 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--grey-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid var(--grey-light);
        }

        .reaction-label {
            font-size: 0.8rem;
            color: var(--grey-mid);
            margin-bottom: 0.3rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .blank-answer {
            background: #FFE5E5;
            border: 3px dashed #C8756E;
            color: #8B5A4C;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
            font-size: 0.9rem;
        }

        .cofactor-tag {
            background: #FFF3CD;
            color: #856404;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .choice-btn {
            background: white;
            border: 2px solid var(--grey-light);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
        }

        .choice-btn:hover {
            border-color: var(--accent);
            background: var(--cream);
            transform: translateX(4px);
        }

        .choice-btn.selected {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .choice-btn.correct {
            background: #7C8B5C;
            color: white;
            border-color: #7C8B5C;
        }

        .choice-btn.incorrect {
            background: #C8756E;
            color: white;
            border-color: #C8756E;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: linear-gradient(135deg, #E8DFD5 0%, #D4C5B9 100%);
            color: var(--grey-dark);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--grey-light);
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--grey-mid);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .feedback {
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .feedback.correct {
            background: #E5F5E5;
            color: #5C6B3C;
            border: 2px solid #7C8B5C;
        }

        .feedback.incorrect {
            background: #FFE5E5;
            color: #8B5A4C;
            border: 2px solid #C8756E;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 107, 93, 0.2);
        }

        .btn-secondary {
            background: var(--grey-light);
            color: var(--grey-dark);
        }

        .btn-secondary:hover {
            background: #D4C9BD;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .pathway-selector {
            margin-bottom: 1.5rem;
        }

        .pathway-selector label {
            font-weight: 600;
            margin-right: 0.8rem;
            color: var(--grey-dark);
            display: block;
            margin-bottom: 0.5rem;
        }

        .pathway-selector select {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 2px solid var(--grey-light);
            font-size: 0.95rem;
            cursor: pointer;
            background: white;
        }

        .pathway-selector select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .metabolite-box {
            background: white;
            border: 2px solid var(--accent);
            padding: 1rem;
            border-radius: 8px;
            margin: 0.5rem;
            display: inline-block;
            min-width: 130px;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .enzyme-circle {
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 10px;
            margin: 0.5rem;
            flex-shrink: 0;
            text-align: center;
            line-height: 1.1;
        }

        .arrow {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 600;
            margin: 0 0.5rem;
        }

        .difficulty-selector {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 0.6rem 1.2rem;
            border: 2px solid var(--grey-light);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .difficulty-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .difficulty-btn:hover {
            border-color: var(--accent);
        }

        @media (max-width: 768px) {
            .mode-selector {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .header-content h1 {
                font-size: 1.4rem;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            .stat-box {
                padding: 1rem;
            }

            .stat-number {
                font-size: 1.4rem;
            }

            .pathway-display {
                padding: 1rem;
            }

            .game-area {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>🧬 Metabolic Pathways Study</h1>
                <p>Learn through study and game modes</p>
            </div>
            <a href="../index.html" class="back-btn">← Back to Games</a>
        </div>

        <div class="mode-selector" id="modeSelector">
            <div class="mode-btn" onclick="selectMode('study')">
                <div class="icon">📚</div>
                <div>Study Mode</div>
                <p style="font-size: 0.75rem; margin-top: 0.5rem; color: var(--grey-mid);">Drag to fill blanks</p>
            </div>
            <div class="mode-btn" onclick="selectMode('game')">
                <div class="icon">🎮</div>
                <div>Game Mode</div>
                <p style="font-size: 0.75rem; margin-top: 0.5rem; color: var(--grey-mid);">Answer questions</p>
            </div>
        </div>

        <!-- STUDY MODE -->
        <div class="game-area" id="studyMode">
            <div class="study-container">
                <div class="pathway-selector">
                    <label for="pathwaySelect">Select Pathway:</label>
                    <select id="pathwaySelect" onchange="loadStudyPathway()">
                        <option value="">-- Choose a Pathway --</option>
                        <option value="glycolysis">Glycolysis</option>
                        <option value="tca">TCA Cycle</option>
                        <option value="gluconeogenesis">Gluconeogenesis</option>
                        <option value="glycogen">Glycogen Metabolism</option>
                        <option value="pentose">Pentose Phosphate</option>
                        <option value="heme">Heme Synthesis</option>
                    </select>
                </div>

                <div class="stats" id="studyStats">
                    <div class="stat-box">
                        <div class="stat-number" id="correctCount">0</div>
                        <div class="stat-label">Correct</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">Total Blanks</div>
                    </div>
                </div>

                <div class="pathway-display" id="pathwayDisplay">
                    <p style="color: var(--grey-mid);">Select a pathway to begin</p>
                </div>

                <div class="card-container">
                    <h3>Drag these cards to fill the blanks:</h3>
                    <div class="cards-grid" id="cardsGrid"></div>
                </div>

                <div class="feedback" id="studyFeedback"></div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="submitStudy()">Submit</button>
                    <button class="btn btn-secondary" onclick="loadStudyPathway()">Restart</button>
                    <button class="btn btn-secondary" onclick="selectMode('menu')">Back to Menu</button>
                </div>
            </div>
        </div>

        <!-- GAME MODE -->
        <div class="game-area" id="gameMode">
            <div class="game-container">
                <div class="difficulty-selector">
                    <button class="difficulty-btn active" onclick="setDifficulty('easy')">Easy</button>
                    <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium</button>
                    <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard</button>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-number" id="score">0</div>
                        <div class="stat-label">Score</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="streak">0</div>
                        <div class="stat-label">Streak</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="accuracy">0%</div>
                        <div class="stat-label">Accuracy</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="total">0</div>
                        <div class="stat-label">Answered</div>
                    </div>
                </div>

                <div class="reaction-display" id="reactionDisplay">
                    <div style="margin-bottom: 1.5rem;">
                        <h3 id="reactionName" style="color: var(--grey-dark); margin-bottom: 0.5rem;">Loading...</h3>
                        <p style="color: var(--grey-mid); font-size: 0.9rem;" id="reactionPathway"></p>
                    </div>
                    <div id="reactionEquation"></div>
                </div>

                <div class="feedback" id="gameFeedback"></div>

                <div class="choices" id="choicesContainer"></div>

                <div class="button-group">
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
                    <button class="btn btn-secondary" onclick="resetGame()">Restart</button>
                    <button class="btn btn-secondary" onclick="selectMode('menu')">Back to Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== GLOBAL DATA =====
        const PATHWAYS = {
            glycolysis: {
                name: 'Glycolysis',
                pathway: [
                    { type: 'metabolite', value: 'Glucose' },
                    { type: 'enzyme', value: 'Hexokinase' },
                    { type: 'metabolite', value: 'Glucose-6-P' },
                    { type: 'enzyme', value: 'PFK-1' },
                    { type: 'metabolite', value: 'Fructose-1,6-BP' },
                    { type: 'enzyme', value: 'Aldolase' },
                    { type: 'metabolite', value: 'G3P (×2)' },
                    { type: 'enzyme', value: 'G3P DH' },
                    { type: 'metabolite', value: '1,3-BPG' },
                    { type: 'enzyme', value: 'PGK' },
                    { type: 'metabolite', value: 'PEP' },
                    { type: 'enzyme', value: 'Pyruvate Kinase' },
                    { type: 'metabolite', value: 'Pyruvate' }
                ]
            },
            tca: {
                name: 'TCA Cycle',
                pathway: [
                    { type: 'metabolite', value: 'Acetyl-CoA' },

                    { type: 'metabolite', value: 'α-KG' },
                    { type: 'enzyme', value: 'α-KGDH' },
                    { type: 'metabolite', value: 'Succinyl-CoA' },
                    { type: 'enzyme', value: 'STK' },
                    { type: 'metabolite', value: 'Succinate' },
                    { type: 'enzyme', value: 'SDH' },
                    { type: 'metabolite', value: 'Fumarate' },
                    { type: 'enzyme', value: 'Fumarase' },
                    { type: 'metabolite', value: 'Malate' },
                    { type: 'enzyme', value: 'MDH' },
                    { type: 'metabolite', value: 'Oxaloacetate' }
                ]
            },
            gluconeogenesis: {
                name: 'Gluconeogenesis',
                pathway: [
                    { type: 'metabolite', value: 'Pyruvate' },
                    { type: 'enzyme', value: 'PC' },
                    { type: 'metabolite', value: 'Oxaloacetate' },
                    { type: 'enzyme', value: 'PEPCK' },
                    { type: 'metabolite', value: 'PEP' },
                    { type: 'enzyme', value: 'Enolase' },
                    { type: 'metabolite', value: '2-PG' },
                    { type: 'enzyme', value: 'PGM' },
                    { type: 'metabolite', value: '3-PG' },
                    { type: 'enzyme', value: 'PGK' },
                    { type: 'metabolite', value: '1,3-BPG' },
                    { type: 'enzyme', value: 'G3P DH' },
                    { type: 'metabolite', value: 'G3P' },
                    { type: 'enzyme', value: 'Aldolase' },
                    { type: 'metabolite', value: 'F-1,6-BP' },
                    { type: 'enzyme', value: 'FBPase-1' },
                    { type: 'metabolite', value: 'F-6-P' },
                    { type: 'enzyme', value: 'G6Pase' },
                    { type: 'metabolite', value: 'Glucose' }
                ]
            },
            glycogen: {
                name: 'Glycogen Metabolism',
                pathway: [
                    { type: 'metabolite', value: 'Glucose' },
                    { type: 'enzyme', value: 'Hexokinase' },
                    { type: 'metabolite', value: 'Glucose-6-P' },
                    { type: 'enzyme', value: 'PGM' },
                    { type: 'metabolite', value: 'Glucose-1-P' },
                    { type: 'enzyme', value: 'UDP-G PPase' },
                    { type: 'metabolite', value: 'UDP-Glucose' },
                    { type: 'enzyme', value: 'GS' },
                    { type: 'metabolite', value: 'Glycogen' },
                    { type: 'enzyme', value: 'GP' },
                    { type: 'metabolite', value: 'Glucose-1-P' },
                    { type: 'enzyme', value: 'PGM' },
                    { type: 'metabolite', value: 'Glucose-6-P' }
                ]
            },
            pentose: {
                name: 'Pentose Phosphate Pathway',
                pathway: [
                    { type: 'metabolite', value: 'Glucose-6-P' },
                    { type: 'enzyme', value: 'G6PD' },
                    { type: 'metabolite', value: '6-Phosphogluconolactone' },
                    { type: 'enzyme', value: '6-PGL Hydrolase' },
                    { type: 'metabolite', value: '6-Phosphogluconate' },
                    { type: 'enzyme', value: '6-PG DH' },
                    { type: 'metabolite', value: 'Ribulose-5-P' },
                    { type: 'enzyme', value: 'R5P Isomerase' },
                    { type: 'metabolite', value: 'Ribose-5-P' }
                ]
            },
            heme: {
                name: 'Heme Biosynthesis',
                pathway: [
                    { type: 'metabolite', value: 'Glycine + Succinyl-CoA' },
                    { type: 'enzyme', value: 'ALAS' },
                    { type: 'metabolite', value: 'δ-ALA' },
                    { type: 'enzyme', value: 'ALAD' },
                    { type: 'metabolite', value: 'PBG' },
                    { type: 'enzyme', value: 'PBGD' },
                    { type: 'metabolite', value: 'Uroporphyrinogen III' },
                    { type: 'enzyme', value: 'Uro Decarb' },
                    { type: 'metabolite', value: 'Coproporphyrinogen III' },
                    { type: 'enzyme', value: 'Copro Oxidase' },
                    { type: 'metabolite', value: 'Protoporphyrinogen IX' },
                    { type: 'enzyme', value: 'PPO' },
                    { type: 'metabolite', value: 'Protoporphyrin IX' },
                    { type: 'enzyme', value: 'Ferrochelatase' },
                    { type: 'metabolite', value: 'HEME' }
                ]
            }
        };

        const REACTIONS = [
            { pathway: 'Glycolysis', name: 'Glucose Phosphorylation', precursor: 'Glucose', enzyme: 'Hexokinase', product: 'Glucose-6-P', cofactor: 'ATP' },
            { pathway: 'Glycolysis', name: 'Rate-Limiting Step', precursor: 'Fructose-6-P', enzyme: 'PFK-1', product: 'Fructose-1,6-BP', cofactor: 'ATP' },
            { pathway: 'Glycolysis', name: 'Aldolase Cleavage', precursor: 'Fructose-1,6-BP', enzyme: 'Aldolase', product: 'G3P + DHAP', cofactor: 'None' },
            { pathway: 'Glycolysis', name: 'G3P Oxidation', precursor: 'G3P', enzyme: 'G3P DH', product: '1,3-BPG', cofactor: 'NAD+' },
            { pathway: 'Glycolysis', name: 'Pyruvate Formation', precursor: 'PEP', enzyme: 'Pyruvate Kinase', product: 'Pyruvate', cofactor: 'ADP→ATP' },
            { pathway: 'TCA Cycle', name: 'Citrate Formation', precursor: 'Acetyl-CoA + OAA', enzyme: 'Citrate Synthase', product: 'Citrate', cofactor: 'CoA' },
            { pathway: 'TCA Cycle', name: 'Isocitrate Formation', precursor: 'Citrate', enzyme: 'Aconitase', product: 'Isocitrate', cofactor: 'None' },
            { pathway: 'TCA Cycle', name: 'Rate-Limiting Step', precursor: 'Isocitrate', enzyme: 'IDH', product: 'α-Ketoglutarate', cofactor: 'NAD+' },
            { pathway: 'TCA Cycle', name: 'Succinyl-CoA Formation', precursor: 'α-KG', enzyme: 'α-KGDH', product: 'Succinyl-CoA', cofactor: 'NAD+' },
            { pathway: 'TCA Cycle', name: 'GTP Production', precursor: 'Succinyl-CoA', enzyme: 'STK', product: 'Succinate', cofactor: 'GDP+Pi→GTP' },
            { pathway: 'Heme', name: 'First Committed Step', precursor: 'Glycine + Succinyl-CoA', enzyme: 'ALAS', product: 'δ-ALA', cofactor: 'PLP' },
            { pathway: 'Heme', name: 'PBG Formation', precursor: 'δ-ALA', enzyme: 'ALAD', product: 'PBG', cofactor: 'Zn2+' }
        ];

        let currentMode = null;
        let currentPathway = null;
        let pathwayState = {};
        let gameState = {
            score: 0,
            streak: 0,
            total: 0,
            correct: 0,
            difficulty: 'easy',
            currentQuestion: null
        };

        // ===== MODE SELECTION =====
        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.game-area').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.mode-btn').forEach(el => el.classList.remove('active'));

            if (mode === 'study') {
                document.getElementById('studyMode').classList.add('active');
                document.querySelector('[onclick="selectMode(\'study\')"]').classList.add('active');
            } else if (mode === 'game') {
                document.getElementById('gameMode').classList.add('active');
                document.querySelector('[onclick="selectMode(\'game\')"]').classList.add('active');
                nextQuestion();
            } else {
                document.querySelectorAll('.mode-btn').forEach(el => el.classList.remove('active'));
            }
        }

        // ===== STUDY MODE =====
        function loadStudyPathway() {
            const select = document.getElementById('pathwaySelect');
            const pathwayKey = select.value;

            if (!pathwayKey) {
                alert('Please select a pathway');
                return;
            }

            currentPathway = PATHWAYS[pathwayKey];
            pathwayState = {};

            generateStudyPathway();
        }

        function generateStudyPathway() {
            const pathway = currentPathway.pathway;
            const display = document.getElementById('pathwayDisplay');
            const grid = document.getElementById('cardsGrid');
            const blanks = [];
            const blankIndices = [];

            const metaboliteIndices = pathway
                .map((item, idx) => item.type === 'metabolite' ? idx : -1)
                .filter(idx => idx !== -1);

            const numBlanks = Math.min(3, Math.ceil(metaboliteIndices.length / 2));
            for (let i = 0; i < numBlanks; i++) {
                const randomIdx = Math.floor(Math.random() * metaboliteIndices.length);
                blankIndices.push(metaboliteIndices[randomIdx]);
                metaboliteIndices.splice(randomIdx, 1);
            }

            display.innerHTML = pathway.map((item, idx) => {
                if (blankIndices.includes(idx)) {
                    blanks.push({ value: item.value, idx });
                    return `<div class="blank-space" id="blank-${idx}" data-value="${item.value}">?</div>`;
                } else if (item.type === 'metabolite') {
                    return `<div class="metabolite-box">${item.value}</div>`;
                } else {
                    return `<div class="enzyme-circle">${item.value.substring(0, 3)}</div>`;
                }
            }).join('<div class="arrow">→</div>');

            grid.innerHTML = blanks.map(blank =>
                `<div class="card" draggable="true" data-value="${blank.value}"
                    ondragstart="dragStart(event)" ondragend="dragEnd(event)">${blank.value}</div>`
            ).join('');

            pathwayState = { blanks, blankIndices };
            updateStudyStats();
        }

        function dragStart(event) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', event.target.dataset.value);
            event.target.style.opacity = '0.6';
        }

        function dragEnd(event) {
            event.target.style.opacity = '1';
        }

        function allowDrop(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        document.addEventListener('dragover', allowDrop);

        document.addEventListener('drop', function(e) {
            if (e.target.classList.contains('blank-space')) {
                const value = e.dataTransfer.getData('text/plain');
                const expected = e.target.dataset.value;

                if (value === expected) {
                    e.target.textContent = value;
                    e.target.classList.add('filled');
                    document.querySelector(`.card[data-value="${value}"]`).classList.add('used');
                    updateStudyStats();
                } else {
                    e.target.classList.add('filled-wrong');
                    setTimeout(() => e.target.classList.remove('filled-wrong'), 500);
                }
            }
        });

        function updateStudyStats() {
            const correct = document.querySelectorAll('.blank-space.filled').length;
            const total = pathwayState.blankIndices ? pathwayState.blankIndices.length : 0;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('totalCount').textContent = total;
        }

        function submitStudy() {
            const unfilled = document.querySelectorAll('.blank-space:not(.filled)').length;
            if (unfilled > 0) {
                alert(`Fill all ${unfilled} blank(s) before submitting!`);
                return;
            }

            const feedback = document.getElementById('studyFeedback');
            feedback.textContent = '✅ Perfect! All metabolites correctly placed!';
            feedback.classList.add('show', 'correct');

            setTimeout(() => {
                loadStudyPathway();
                feedback.classList.remove('show');
            }, 2000);
        }

        // ===== GAME MODE =====
        function setDifficulty(level) {
            gameState.difficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            resetGame();
        }

        function nextQuestion() {
            gameState.currentQuestion = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
            displayQuestion();
        }

        function displayQuestion() {
            const q = gameState.currentQuestion;
            const blankTypes = ['enzyme', 'precursor', 'product', 'cofactor'];
            const blankType = blankTypes[Math.floor(Math.random() * blankTypes.length)];

            const reactionName = document.getElementById('reactionName');
            const reactionPathway = document.getElementById('reactionPathway');
            const equation = document.getElementById('reactionEquation');
            const choicesContainer = document.getElementById('choicesContainer');

            reactionName.textContent = q.name;
            reactionPathway.textContent = `Pathway: ${q.pathway}`;

            let eqHTML = `
                <div style="display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 1rem;">
                    <div class="reaction-box">
                        <div class="reaction-label">Substrate</div>
                        ${blankType === 'precursor' ? `<div class="blank-answer">?</div>` : `<div>${q.precursor}</div>`}
                    </div>
                    <div class="arrow">+</div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <div class="reaction-label">Enzyme</div>
                        ${blankType === 'enzyme' ? `<div class="enzyme-circle" style="width: 50px; height: 50px; font-size: 11px;">?</div>` : `<div class="enzyme-circle" style="width: 50px; height: 50px; font-size: 9px;">${q.enzyme}</div>`}
                    </div>
                    <div class="arrow">→</div>
                    <div class="reaction-box">
                        <div class="reaction-label">Product</div>
                        ${blankType === 'product' ? `<div class="blank-answer">?</div>` : `<div>${q.product}</div>`}
                    </div>
                    <div class="arrow">+</div>
                    <div class="reaction-box">
                        <div class="reaction-label">Cofactor</div>
                        ${blankType === 'cofactor' ? `<div class="blank-answer">?</div>` : `<span class="cofactor-tag">${q.cofactor}</span>`}
                    </div>
                </div>
            `;
            equation.innerHTML = eqHTML;

            const choices = generateChoices(blankType, q);
            choicesContainer.innerHTML = choices.map((choice, idx) => `
                <button class="choice-btn" onclick="selectChoice(this, '${choice.value}', ${choice.correct})">
                    ${choice.label}
                </button>
            `).join('');

            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('gameFeedback').classList.remove('show');
        }

        function generateChoices(blankType, reaction) {
            const correct = {
                enzyme: { value: reaction.enzyme, label: reaction.enzyme },
                precursor: { value: reaction.precursor, label: reaction.precursor },
                product: { value: reaction.product, label: reaction.product },
                cofactor: { value: reaction.cofactor, label: reaction.cofactor }
            }[blankType];

            let allOptions = [];
            if (blankType === 'enzyme') {
                allOptions = [...new Set(REACTIONS.map(r => r.enzyme))];
            } else if (blankType === 'precursor') {
                allOptions = [...new Set(REACTIONS.map(r => r.precursor).flatMap(p => p.split(' + ')))];
            } else if (blankType === 'product') {
                allOptions = [...new Set(REACTIONS.map(r => r.product).flatMap(p => p.split(' + ')))];
            } else {
                allOptions = [...new Set(REACTIONS.map(r => r.cofactor).flatMap(c => c.split('→')))];
            }

            const others = allOptions
                .filter(opt => opt !== correct.value && opt.trim() !== '')
                .sort(() => Math.random() - 0.5)
                .slice(0, 4);

            const choices = [correct, ...others.map(v => ({ value: v, label: v }))];

            return choices.sort(() => Math.random() - 0.5).map((c, idx) => ({
                ...c,
                correct: c.value === correct.value
            }));
        }

        function selectChoice(btn, value, correct) {
            const feedback = document.getElementById('gameFeedback');

            if (correct) {
                document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
                btn.classList.add('correct');

                gameState.score += (gameState.difficulty === 'easy' ? 10 : gameState.difficulty === 'medium' ? 20 : 30);
                gameState.streak++;
                gameState.correct++;
                feedback.textContent = '✅ Correct! Next question...';
                feedback.classList.remove('incorrect');
                feedback.classList.add('correct');
                gameState.total++;
                feedback.classList.add('show');
                updateGameStats();

                setTimeout(() => {
                    nextQuestion();
                }, 1500);
            } else {
                btn.classList.add('incorrect');
                btn.disabled = true;

                feedback.textContent = '❌ Try again!';
                feedback.classList.remove('correct');
                feedback.classList.add('incorrect');
                feedback.classList.add('show');
            }
        }

        function updateGameStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('streak').textContent = gameState.streak;
            document.getElementById('total').textContent = gameState.total;
            const accuracy = gameState.total > 0 ? Math.round((gameState.correct / gameState.total) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function resetGame() {
            gameState = { score: 0, streak: 0, total: 0, correct: 0, difficulty: gameState.difficulty, currentQuestion: null };
            updateGameStats();
            nextQuestion();
        }
    </script>
</body>
</html>
